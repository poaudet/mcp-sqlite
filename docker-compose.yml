services:
  sqlite-mcp:
    build: .
    container_name: sqlite-mcp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/db.sqlite
      READ_ONLY: "false"
      MAX_ROWS: "200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
